<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GRT Netmon NMS</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233B82F6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='5' y='4' width='14' height='7' rx='2' /%3E%3Crect x='5' y='13' width='14' height='7' rx='2' /%3E%3Cpath d='M8 7.5h.01M8 16.5h.01'/%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-effect {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body
    class="bg-gray-990 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-blue-900 via-gray-900 to-black min-h-screen flex items-center justify-center p-4 text-white">

    <div class="max-w-md w-full glass-effect rounded-3xl p-8 shadow-2xl">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-extrabold tracking-tight mb-2 flex items-center justify-center">
                <div class="p-1.5 bg-blue-600/10 rounded-lg mr-3">
                    <svg class="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01" />
                    </svg>
                </div>
                <span>GRT <span class="text-blue-500">NETMON</span></span>
            </h1>
            <p class="text-gray-400 text-sm">Silakan login untuk mengakses panel NMS</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label
                    class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 px-1">Username</label>
                <input type="text" id="username" required
                    class="w-full bg-gray-800 border-gray-700 text-white rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition outline-none"
                    placeholder="Masukkan username">
            </div>

            <div>
                <label
                    class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 px-1">Password</label>
                <input type="password" id="password" required
                    class="w-full bg-gray-800 border-gray-700 text-white rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition outline-none"
                    placeholder="••••••••">
            </div>

            <div id="errorMessage"
                class="hidden bg-red-900/50 border border-red-500 text-red-200 p-3 rounded-lg text-xs text-center">
                Username atau password salah!
            </div>

            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-900/20 transform active:scale-95 transition-all">
                MASUK KE PANEL
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-gray-800 text-center">
            <p class="text-gray-500 text-xs">OLT Multi-Vendor Monitoring System v1.0</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
